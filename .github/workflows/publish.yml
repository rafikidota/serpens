name: Publish Package

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  guard:
    if: github.repository == 'rafikidota/serpens'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      dist_tag: ${{ steps.resolve.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate tag and resolve dist-tag
        id: resolve
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"

          if [ "$VERSION" != "$PKG" ]; then
            echo "::error::Tag v$VERSION does not match package.json ($PKG). Use 'pnpm version' to keep them in sync."
            exit 1
          fi

          if [[ "$VERSION" == *-* ]]; then
            DIST_TAG=next
          else
            DIST_TAG=latest
          fi

          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION → dist-tag $DIST_TAG" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [ci, guard]
    if: github.repository == 'rafikidota/serpens'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Publish to npm
        env:
          DIST_TAG: ${{ needs.guard.outputs.dist_tag }}
        run: pnpm publish --no-git-checks --provenance --tag "$DIST_TAG"
